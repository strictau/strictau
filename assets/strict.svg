<svg xmlns="http://www.w3.org/2000/svg" width="784" height="204" viewBox="0 0 784 204" role="img" aria-labelledby="title desc">
  <title id="title">strict</title>
  <desc id="desc">STRICT in white block ASCII lettering with a looping glitch effect.</desc>
  <style>
    @keyframes tear-a { 0%,5.99%,12%,63.99%,69%,100% { transform:translateX(0); } 6% { transform:translateX(5px); } 7% { transform:translateX(-8px); } 8% { transform:translateX(10px); } 9% { transform:translateX(-4px); } 10% { transform:translateX(6px); } 11% { transform:translateX(-2px); } 64% { transform:translateX(-7px); } 65% { transform:translateX(6px); } 66% { transform:translateX(-4px); } 67% { transform:translateX(3px); } 68% { transform:translateX(-1px); } }
    @keyframes tear-b { 0%,5.99%,12%,63.99%,69%,100% { transform:translateX(0); } 6% { transform:translateX(-6px); } 7% { transform:translateX(11px); } 8% { transform:translateX(-5px); } 9% { transform:translateX(7px); } 10% { transform:translateX(-3px); } 11% { transform:translateX(2px); } 64% { transform:translateX(8px); } 65% { transform:translateX(-10px); } 66% { transform:translateX(5px); } 67% { transform:translateX(-3px); } 68% { transform:translateX(1px); } }
    @keyframes tear-c { 0%,5.99%,12%,63.99%,69%,100% { transform:translateX(0); } 6% { transform:translateX(2px); } 7% { transform:translateX(-4px); } 8% { transform:translateX(7px); } 9% { transform:translateX(-9px); } 10% { transform:translateX(4px); } 11% { transform:translateX(-1px); } 64% { transform:translateX(-4px); } 65% { transform:translateX(9px); } 66% { transform:translateX(-6px); } 67% { transform:translateX(4px); } 68% { transform:translateX(-2px); } }
    .slice { transform-box:view-box; transform-origin:0 0; animation-duration:4.8s; animation-timing-function:steps(1,end); animation-iteration-count:infinite; }
    .slice-a { animation-name:tear-a; }
    .slice-b { animation-name:tear-b; }
    .slice-c { animation-name:tear-c; }
    @media (prefers-reduced-motion:reduce) { .slice { animation:none; } }
  </style>
  <defs>
    <g id="ascii"><g fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="24"><text x="32" y="40" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">███████╗ ████████╗ ██████╗  ██╗  ██████╗ ████████╗</text><text x="32" y="66" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██╔════╝ ╚══██╔══╝ ██╔══██╗ ██║ ██╔════╝ ╚══██╔══╝</text><text x="32" y="92" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">███████╗    ██║    ██████╔╝ ██║ ██║         ██║   </text><text x="32" y="118" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╚════██║    ██║    ██╔══██╗ ██║ ██║         ██║   </text><text x="32" y="144" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">███████║    ██║    ██║  ██║ ██║ ╚██████╗    ██║   </text><text x="32" y="170" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╚══════╝    ╚═╝    ╚═╝  ╚═╝ ╚═╝  ╚═════╝    ╚═╝   </text></g></g>
    <clipPath id="band-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="12" width="784" height="18"/></clipPath>
    <clipPath id="band-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="30" width="784" height="24"/></clipPath>
    <clipPath id="band-2" clipPathUnits="userSpaceOnUse"><rect x="0" y="54" width="784" height="24"/></clipPath>
    <clipPath id="band-3" clipPathUnits="userSpaceOnUse"><rect x="0" y="78" width="784" height="24"/></clipPath>
    <clipPath id="band-4" clipPathUnits="userSpaceOnUse"><rect x="0" y="102" width="784" height="24"/></clipPath>
    <clipPath id="band-5" clipPathUnits="userSpaceOnUse"><rect x="0" y="126" width="784" height="24"/></clipPath>
    <clipPath id="band-6" clipPathUnits="userSpaceOnUse"><rect x="0" y="150" width="784" height="24"/></clipPath>
    <clipPath id="band-7" clipPathUnits="userSpaceOnUse"><rect x="0" y="174" width="784" height="14"/></clipPath>
  </defs>
  <rect width="784" height="204" fill="#111416"/>
  <g clip-path="url(#band-0)"><g class="slice slice-a"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-1)"><g class="slice slice-b"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-2)"><g class="slice slice-c"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-3)"><g class="slice slice-b"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-4)"><g class="slice slice-a"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-5)"><g class="slice slice-c"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-6)"><g class="slice slice-a"><use href="#ascii"/></g></g>
  <g clip-path="url(#band-7)"><g class="slice slice-b"><use href="#ascii"/></g></g>
</svg>
